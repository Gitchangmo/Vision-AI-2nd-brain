<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vision Wiki Chat</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>
<body>
<aside id="sidebar" aria-label="저장된 대화">
  <button id="new-chat" type="button">＋ 새 대화</button>
  <p class="sidebar-hint">대화는 답변마다 이 PC에 자동 저장돼요.</p>
  <ul id="conversation-list"></ul>
</aside>
<div id="sidebar-backdrop" hidden></div>

<div id="page">
  <header>
    <button id="toggle-sidebar" type="button" aria-label="대화 목록 열기">☰</button>
    <div>
      <h1>Vision Wiki Chat</h1>
      <p id="wiki-info">위키 불러오는 중…</p>
    </div>
  </header>

  <main id="messages" aria-live="polite">
    <section class="empty" id="empty">
      <p>위키에 정리된 비전검사 지식을 근거로 답해요.</p>
      <ul>
        <li><button type="button" class="example">검정 고무 부품에서 싱크마크 볼 때 조명은 뭘 써야 해?</button></li>
        <li><button type="button" class="example">시야 50mm에서 0.2mm 이물 찾으려면 카메라 해상도 얼마나 필요해?</button></li>
        <li><button type="button" class="example">룰 기반이랑 이상 탐지 중 신규 금형 초기엔 뭐가 나아?</button></li>
      </ul>
    </section>
  </main>

  <form id="composer">
    <div id="attachments" hidden></div>
    <div class="row">
      <button id="attach" type="button" title="이미지 첨부 (붙여넣기·드래그도 가능)" aria-label="이미지 첨부">📎</button>
      <input id="file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple hidden>
      <textarea id="input" rows="1" placeholder="질문을 입력하세요 (Enter 전송, Shift+Enter 줄바꿈, 이미지는 붙여넣기·드래그)"></textarea>
      <button id="send" type="submit">전송</button>
    </div>
    <p class="hint">이미지는 최대 5장. 대화와 이미지는 이 PC에만 저장되고 저장소에는 올라가지 않아요.</p>
  </form>
</div>

<div id="drop-overlay" hidden>이미지를 놓으면 첨부돼요</div>

<div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="이미지 미리보기">
  <img id="lightbox-image" alt="">
  <button id="lightbox-close" type="button" aria-label="닫기">✕</button>
  <button id="lightbox-prev" type="button" aria-label="이전 이미지">‹</button>
  <button id="lightbox-next" type="button" aria-label="다음 이미지">›</button>
  <p id="lightbox-counter"></p>
</div>

<script src="/static/app.js"></script>
</body>
</html>
